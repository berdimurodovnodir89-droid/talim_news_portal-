{% extends 'base.html' %}

{% block title %}
{{ page_title }}
{% endblock %}

{% block content %}

<div class="container">

    <h1 class="page-title">
        {{ page_title }}
    </h1>

    <div class="news-grid">

        {% for item in items %}

        <div class="news-card">

            <div class="news-body">

                <span class="category">
                    KUN.UZ
                </span>

                <h2>
                    {{ item.title }}
                </h2>

                <p>
                    {{ item.summary|safe|truncatewords:25 }}
                </p>

                <small>
                    {{ item.published }}
                </small>

                <br><br>

                <a
                    class="read-more"
                    href="/detail/?title={{ item.title }}&summary={{ item.summary }}&published={{ item.published }}"
                >
                    Batafsil o‘qish
                </a>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
