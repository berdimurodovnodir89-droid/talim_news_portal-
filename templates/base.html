<!DOCTYPE html>
<html lang="uz">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        KUN News Portal
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

</head>
<script>
const hamburgerBtn = document.getElementById("hamburgerBtn");
const navLinks = document.getElementById("navLinks");

hamburgerBtn.addEventListener("click", () => {
    navLinks.classList.toggle("active");
});
</script>
<body>

<nav class="navbar">

    <a href="/" class="logo">
        <i class="fa-solid fa-newspaper"></i>
        <span>KUN NEWS</span>
    </a>

    <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <ul class="nav-links" id="navLinks">
        <li>
            <a href="/">
                <i class="fa-solid fa-house"></i>
                Asosiy
            </a>
        </li>
        <li>
            <a href="/talim/">
                <i class="fa-solid fa-graduation-cap"></i>
                Ta'lim
            </a>
        </li>
        <li>
            <a href="/texnologiya/">
                <i class="fa-solid fa-microchip"></i>
                Texnologiya
            </a>
        </li>
        <li>
            <a href="/sport/">
                <i class="fa-solid fa-futbol"></i>
                Sport
            </a>
        </li>
        <li>
            <a href="/jahon/">
                <i class="fa-solid fa-earth-americas"></i>
                Jahon
            </a>
        </li>
        <li>
            <a href="/about/">
                <i class="fa-solid fa-circle-info"></i>
                Dastur haqida
            </a>
        </li>
    </ul>

</nav>
<div class="search-box">
    <form action="{% url 'search' %}" method="GET">
        <input type="text" name="q" placeholder="Yangilik qidirish...">
        <button type="submit">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
    </form>
</div>
<main>
{% block content %}
{% endblock %}
</main>
<footer class="footer">
    <div class="footer-content">
        <h3>KUN NEWS</h3>
        <p>O‘zbekiston va jahon yangiliklari portali</p>

        <div class="footer-links">
            <a href="/">Asosiy</a>
            <a href="/talim/">Ta'lim</a>
            <a href="/texnologiya/">Texnologiya</a>
            <a href="/sport/">Sport</a>
            <a href="/jahon/">Jahon</a>
        </div>

        <p class="copyright">
            © 2026 KUN NEWS. Barcha huquqlar himoyalangan.
        </p>
    </div>
</footer>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #eef3ff;
    font-family: Arial, sans-serif;
}

/* ===== NAVBAR ===== */

.navbar {
    width: 100%;
    background: linear-gradient(135deg, #001847, #002f87);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 40px;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 5px 20px rgba(0,0,0,.15);
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: white;
}

.logo i {
    color: #4da3ff;
    font-size: 32px;
}

.logo span {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 1px;
}

/* ===== NAV LINKS ===== */

.nav-links {
    display: flex;
    list-style: none;
    gap: 10px;
    align-items: center;
}

.nav-links a {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    background: rgba(255,255,255,.1);
    border-radius: 12px;
    color: white;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    transition: .25s;
    white-space: nowrap;
}

.nav-links a:hover {
    background: white;
    color: #001847;
    transform: translateY(-2px);
}

.nav-links i {
    font-size: 16px;
}

/* ===== HAMBURGER TUGMA ===== */

.hamburger {
    display: none;
    flex-direction: column;
    justify-content: space-between;
    width: 30px;
    height: 22px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
}

.hamburger span {
    display: block;
    width: 100%;
    height: 3px;
    background: white;
    border-radius: 3px;
    transition: .3s;
}

.hamburger.active span:nth-child(1) {
    transform: translateY(9.5px) rotate(45deg);
}
.hamburger.active span:nth-child(2) {
    opacity: 0;
}
.hamburger.active span:nth-child(3) {
    transform: translateY(-9.5px) rotate(-45deg);
}

/* ===== MAIN CONTENT ===== */

main {
    min-height: 80vh;
}

/* ===== TABLET (max 1100px) ===== */

@media (max-width: 1100px) {
    .navbar {
        padding: 16px 24px;
    }

    .nav-links a {
        padding: 9px 13px;
        font-size: 14px;
    }
}

/* ===== MOBILE (max 768px) ===== */

@media (max-width: 768px) {

    .navbar {
        padding: 14px 20px;
        flex-wrap: wrap;
        position: relative;
    }

    .hamburger {
        display: flex;
    }

    .nav-links {
        display: none;
        flex-direction: column;
        width: 100%;
        gap: 8px;
        padding: 12px 0 4px 0;
        order: 3;
    }

    .nav-links.open {
        display: flex;
    }

    .nav-links li {
        width: 100%;
    }

    .nav-links a {
        width: 100%;
        justify-content: flex-start;
        padding: 13px 18px;
        font-size: 16px;
        border-radius: 12px;
        background: rgba(255,255,255,.1);
    }

    .nav-links a:hover {
        background: white;
        color: #001847;
    }

    .logo span {
        font-size: 22px;
    }

    .logo i {
        font-size: 26px;
    }
}

</style>

<script>
const btn = document.getElementById('hamburgerBtn');
const nav = document.getElementById('navLinks');

btn.addEventListener('click', function() {
    btn.classList.toggle('active');
    nav.classList.toggle('open');
});

nav.querySelectorAll('a').forEach(function(link) {
    link.addEventListener('click', function() {
        btn.classList.remove('active');
        nav.classList.remove('open');
    });
});
</script>

</body>
</html>
