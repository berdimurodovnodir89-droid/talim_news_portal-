<!DOCTYPE html>
<html lang="uz">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>

        {% block title %}
        ABDULLA NEWS
        {% endblock %}

    </title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

</head>

<body>

<nav class="navbar">

    <div class="logo">

        <i class="fa-solid fa-newspaper"></i>

        <span>
            ABDULLA NEWS
        </span>

    </div>

    <ul class="nav-links">

        <li>

            <a href="/">

                <i class="fa-solid fa-house"></i>

                Asosiy

            </a>

        </li>

        <li>

            <a href="/talim/">

                <i class="fa-solid fa-graduation-cap"></i>

                Ta'lim

            </a>

        </li>

        <li>

            <a href="/texnologiya/">

                <i class="fa-solid fa-microchip"></i>

                Texnologiya

            </a>

        </li>

        <li>

            <a href="/sport/">

                <i class="fa-solid fa-football"></i>

                Sport

            </a>

        </li>

        <li>

            <a href="/jahon/">

                <i class="fa-solid fa-earth-americas"></i>

                Jahon

            </a>

        </li>

        <li>

            <a href="/about/">

                <i class="fa-solid fa-circle-info"></i>

                Dastur haqida

            </a>

        </li>

    </ul>

</nav>


{% block content %}

{% endblock %}


<style>

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    font-family: Arial, sans-serif;
    background: #f4f7fb;
}

.navbar{
    width: 100%;
    background: linear-gradient(135deg,#001847,#002b75);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 70px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo{
    display: flex;
    align-items: center;
    gap: 12px;
    color: white;
    font-size: 34px;
    font-weight: 800;
}

.logo i{
    color: #4da3ff;
}

.nav-links{
    display: flex;
    align-items: center;
    gap: 18px;
    list-style: none;
}

.nav-links li a{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 22px;
    background: rgba(255,255,255,0.08);
    border-radius: 14px;
    text-decoration: none;
    color: white;
    font-size: 18px;
    font-weight: 600;
    transition: 0.3s;
}

.nav-links li a:hover{
    background: white;
    color: #001847;
    transform: translateY(-3px);
}

.nav-links li a i{
    font-size: 18px;
}

@media(max-width:1100px){

    .navbar{
        flex-direction: column;
        gap: 25px;
        padding: 25px;
    }

    .nav-links{
        flex-wrap: wrap;
        justify-content: center;
    }

}

@media(max-width:768px){

    .logo{
        font-size: 26px;
    }

    .nav-links{
        width: 100%;
        flex-direction: column;
    }

    .nav-links li{
        width: 100%;
    }

    .nav-links li a{
        width: 100%;
        justify-content: center;
    }

}

</style>

</body>
</html>
