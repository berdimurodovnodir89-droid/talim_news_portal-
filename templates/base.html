<!DOCTYPE html>
<html lang="uz">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Ta'lim News Portal
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

</head>

<body>

<nav class="navbar">

    <a href="/" class="logo">

        <i class="fa-solid fa-newspaper"></i>

        <span>
            TA'LIM NEWS
        </span>

    </a>

    <ul class="nav-links">

        <li>
            <a href="/">
                <i class="fa-solid fa-house"></i>
                Asosiy
            </a>
        </li>

        <li>
            <a href="/talim/">
                <i class="fa-solid fa-graduation-cap"></i>
                Ta'lim
            </a>
        </li>

        <li>
            <a href="/texnologiya/">
                <i class="fa-solid fa-microchip"></i>
                Texnologiya
            </a>
        </li>

        <li>
            <a href="/sport/">
                <i class="fa-solid fa-futbol"></i>
                Sport
            </a>
        </li>

        <li>
            <a href="/jahon/">
                <i class="fa-solid fa-earth-americas"></i>
                Jahon
            </a>
        </li>

        <li>
            <a href="/about/">
                <i class="fa-solid fa-circle-info"></i>
                Dastur haqida
            </a>
        </li>

    </ul>

</nav>

<main>

{% block content %}
{% endblock %}

</main>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#eef3ff;
    font-family:Arial,sans-serif;
}

/* NAVBAR */

.navbar{
    width:100%;
    background:linear-gradient(135deg,#001847,#002f87);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 60px;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.logo{
    display:flex;
    align-items:center;
    gap:15px;
    text-decoration:none;
    color:white;
}

.logo i{
    color:#4da3ff;
    font-size:40px;
}

.logo span{
    font-size:42px;
    font-weight:800;
    letter-spacing:1px;
}

/* MENU */

.nav-links{
    display:flex;
    list-style:none;
    gap:15px;
}

.nav-links a{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 22px;
    background:rgba(255,255,255,.08);
    border-radius:14px;
    color:white;
    text-decoration:none;
    font-size:18px;
    font-weight:600;
    transition:.3s;
}

.nav-links a:hover{
    background:white;
    color:#001847;
    transform:translateY(-3px);
}

.nav-links i{
    font-size:18px;
}

/* CONTENT */

main{
    min-height:80vh;
}

/* MOBILE */

@media(max-width:1200px){

    .navbar{
        flex-direction:column;
        gap:25px;
    }

    .nav-links{
        flex-wrap:wrap;
        justify-content:center;
    }

}

@media(max-width:768px){

    .navbar{
        padding:20px;
    }

    .logo span{
        font-size:28px;
    }

    .logo i{
        font-size:30px;
    }

    .nav-links{
        width:100%;
        flex-direction:column;
    }

    .nav-links li{
        width:100%;
    }

    .nav-links a{
        width:100%;
        justify-content:center;
    }

}

</style>

</body>
</html>
