{% load static %}

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
        KUN NEWS
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/detail.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
</head>
<script src="{% static 'js/main.js' %}"></script>
<body>

<nav class="navbar">

    <a href="/" class="logo">
        <i class="fa-solid fa-newspaper"></i>
        <span>KUN NEWS</span>
    </a>

    <button class="hamburger" id="hamburgerBtn">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <ul class="nav-links" id="navLinks">
        <li><a href="/">Asosiy</a></li>
        <li><a href="/talim/">Ta'lim</a></li>
        <li><a href="/texnologiya/">Texnologiya</a></li>
        <li><a href="/sport/">Sport</a></li>
        <li><a href="/jahon/">Jahon</a></li>
        <li><a href="/about/">Dastur haqida</a></li>
    </ul>

</nav>

<div class="search-box">
    <form action="{% url 'search' %}" method="GET">
        <input
            type="text"
            name="q"
            placeholder="Yangilik qidirish..."
            value="{{ request.GET.q }}"
        >
        <button type="submit">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
    </form>
</div>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer class="footer">

    <h3>KUN NEWS</h3>

    <p>
        O‘zbekiston va jahon yangiliklari portali
    </p>

    <div class="footer-links">
        <a href="/">Asosiy</a>
        <a href="/talim/">Ta'lim</a>
        <a href="/texnologiya/">Texnologiya</a>
        <a href="/sport/">Sport</a>
        <a href="/jahon/">Jahon</a>
    </div>

    <p>
        © 2026 KUN NEWS
    </p>

</footer>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#eef3ff;
    font-family:Arial,sans-serif;
}

.navbar{
    background:#001847;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:white;
    text-decoration:none;
    font-size:24px;
    font-weight:bold;
}

.logo i{
    margin-right:8px;
}

.nav-links{
    display:flex;
    list-style:none;
    gap:15px;
}

.nav-links a{
    color:white;
    text-decoration:none;
}

.search-box{
    width:90%;
    max-width:900px;
    margin:20px auto;
}

.search-box form{
    display:flex;
}

.search-box input{
    flex:1;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px 0 0 12px;
}

.search-box button{
    border:none;
    padding:0 20px;
    background:#001847;
    color:white;
    border-radius:0 12px 12px 0;
}

.footer{
    background:#001847;
    color:white;
    text-align:center;
    padding:40px 20px;
    margin-top:40px;
}

.footer-links{
    margin:20px 0;
}

.footer-links a{
    color:white;
    text-decoration:none;
    margin:0 10px;
}

.hamburger{
    display:none;
}

@media(max-width:768px){

    .hamburger{
        display:block;
        background:none;
        border:none;
        color:white;
    }

    .nav-links{
        display:none;
    }

    .nav-links.open{
        display:flex;
        flex-direction:column;
        width:100%;
        margin-top:15px;
    }

    .navbar{
        flex-wrap:wrap;
    }
}

.pagination{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:30px 0;
}

.pagination a{
    padding:10px 15px;
    background:#001847;
    color:white;
    text-decoration:none;
    border-radius:8px;
}

.pagination span{
    padding:10px 15px;
    background:#ddd;
    color:#555;
    border-radius:8px;
}

</style>

<script>

document.addEventListener("DOMContentLoaded",function(){

    const btn=document.getElementById("hamburgerBtn");
    const nav=document.getElementById("navLinks");

    if(btn){

        btn.addEventListener("click",function(){
            nav.classList.toggle("open");
        });

    }

});

</script>

</body>
</html>
